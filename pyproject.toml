[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-insight-v2"
version = "0.1.0"
description = "Evidence-first terminal research pipeline (collect → extract → backfill → verify → excel → vote)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "openpyxl>=3.1.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "tenacity>=8.5.0",
  "python-dotenv>=1.0.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gui = ["pywebview>=5.0"]
packaging = ["pywebview>=5.0", "pyinstaller>=6.0"]

[project.scripts]
terminal-insight-v2 = "terminal_insight_v2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"terminal_insight_v2.store" = ["schema/*.sql"]
"terminal_insight_v2.gui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
